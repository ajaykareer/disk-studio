name: Windows build and validation
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish version 1.0.0 after validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests and reproducible benchmark
        shell: pwsh
        run: |
          dotnet run --project tests/DiskStudio.Tests -c Release -- artifacts/validation
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Publish portable Windows x64 app
        shell: pwsh
        run: ./Build.ps1
      - name: Exercise the published WPF app and render both themes
        shell: pwsh
        run: ./scripts/Smoke-Test.ps1 -Executable (Resolve-Path artifacts/win-x64/DiskStudio.exe)
      - name: Package executable and checksum
        shell: pwsh
        run: |
          Copy-Item artifacts/win-x64/DiskStudio.exe artifacts/DiskStudio-1.0.0-win-x64.exe
          $hash = (Get-FileHash artifacts/DiskStudio-1.0.0-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DiskStudio-1.0.0-win-x64.exe" | Set-Content artifacts/SHA256SUMS.txt
          Copy-Item README.md artifacts/win-x64/README.md
          Copy-Item LICENSE artifacts/win-x64/LICENSE
          Compress-Archive artifacts/win-x64/* artifacts/DiskStudio-1.0.0-win-x64.zip
          $zipHash = (Get-FileHash artifacts/DiskStudio-1.0.0-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  DiskStudio-1.0.0-win-x64.zip" | Add-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DiskStudio-validation
          path: artifacts/validation/
      - uses: actions/upload-artifact@v4
        with:
          name: DiskStudio-Windows-x64
          path: |
            artifacts/DiskStudio-1.0.0-win-x64.exe
            artifacts/DiskStudio-1.0.0-win-x64.zip
            artifacts/SHA256SUMS.txt
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DiskStudio-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: DiskStudio-validation
          path: validation
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create v1.0.0 release/* \
            validation/benchmark.json validation/core-tests.txt validation/ui-smoke.txt validation/*.png \
            --target "$RELEASE_COMMIT" --title "Disk Studio 1.0.0" \
            --notes-file docs/RELEASE.md
